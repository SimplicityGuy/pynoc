version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    assignees:
      - "SimplicityGuy"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-version:
        applies-to: version-updates
        patterns: ["*"]
